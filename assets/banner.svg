<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b176fc" />
      <stop offset="100%" stop-color="#e0c3fc" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#b176fc" stop-opacity="0.3" />
    </linearGradient>

    <!-- Filter for neon glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="1.2" opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#374151" opacity="0.4" />
    </pattern>

    <style>
      @keyframes dash {
        to {
          stroke-dashoffset: -120;
        }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes scanline {
        0% { transform: translateY(-400px); }
        100% { transform: translateY(400px); }
      }
      @keyframes agentMove {
        0% { offset-distance: 0%; }
        100% { offset-distance: 100%; }
      }
      .animated-path {
        stroke-dasharray: 12, 8;
        animation: dash 3s linear infinite;
      }
      .agent-pulse {
        animation: pulse 2.5s ease-in-out infinite;
        transform-origin: center;
      }
      .chip {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- 2D Grid Background Simulation -->
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="200" cy="100" r="140" fill="#00f2fe" opacity="0.07" filter="url(#glow)" />
  <circle cx="1020" cy="280" r="180" fill="#7928ca" opacity="0.08" filter="url(#glow)" />

  <!-- Dynamic Animated Pathfinding Search Rays & Navmesh Waypoints (Background / Decorative) -->
  <g opacity="0.6">
    <!-- Obstacle Blocks -->
    <rect x="820" y="70" width="70" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="940" y="160" width="80" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="740" y="240" width="90" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2" />

    <!-- Explored Vector Lines (A* / Theta* Pathfinding Search Tree) -->
    <path d="M 680,320 L 730,220 L 820,180 L 880,180 L 930,120 L 1080,100" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.4" stroke-dasharray="4,4" />
    <path d="M 680,320 L 700,270 L 790,230 L 860,260 L 980,260 L 1080,100" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.3" stroke-dasharray="4,4" />

    <!-- Optimal Solution Vector Path (Dynamic Flow) -->
    <path d="M 660,340 Q 720,290 770,180 T 900,120 T 1040,110 T 1110,90" fill="none" stroke="url(#neonCyan)" stroke-width="4.5" class="animated-path" filter="url(#glow)" />

    <!-- Start Node & Goal Node -->
    <g transform="translate(660, 340)">
      <circle r="12" fill="#00f2fe" opacity="0.2" class="agent-pulse" />
      <circle r="6" fill="#00f2fe" filter="url(#softGlow)" />
    </g>
    <g transform="translate(1110, 90)">
      <circle r="14" fill="#10b981" opacity="0.25" class="agent-pulse" />
      <circle r="7" fill="#10b981" filter="url(#softGlow)" />
      <text x="18" y="5" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">GOAL (Target)</text>
    </g>
  </g>

  <!-- Foreground Overlay Layer: Titles & Highlights are completely clear and sharp -->
  <g transform="translate(80, 0)">
    
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 68)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#00f2fe" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="16" r="5" fill="#00f2fe" class="agent-pulse" />
      <text x="32" y="21" fill="#38bdf8" class="chip">GAME AI &amp; 2D PATHFINDING SUITE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="160" fill="#ffffff" class="title-text" font-size="46" filter="url(#softGlow)">
      2D Pathfinding &amp; Game AI
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="205" fill="#94a3b8" class="subtitle-text" font-size="19">
      Curated Engine Frameworks, NavMeshes, JPS+, Recast, &amp; Spatial Algorithms
    </text>

    <!-- Dynamic Category Pills / Tech Stack in Foreground -->
    <g transform="translate(0, 245)">
      <!-- Pill 1: A* & JPS+ -->
      <g transform="translate(0, 0)">
        <rect width="130" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <text x="65" y="23" fill="#38bdf8" text-anchor="middle" class="chip">⚡ A* &amp; JPS+</text>
      </g>
      <!-- Pill 2: NavMesh 2D -->
      <g transform="translate(142, 0)">
        <rect width="145" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <text x="72.5" y="23" fill="#a78bfa" text-anchor="middle" class="chip">🗺️ NavMesh 2D</text>
      </g>
      <!-- Pill 3: Flow Fields -->
      <g transform="translate(299, 0)">
        <rect width="135" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <text x="67.5" y="23" fill="#34d399" text-anchor="middle" class="chip">🌊 Flow Fields</text>
      </g>
      <!-- Pill 4: RVO2 Avoidance -->
      <g transform="translate(446, 0)">
        <rect width="155" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <text x="77.5" y="23" fill="#f472b6" text-anchor="middle" class="chip">👥 RVO2 Crowd AI</text>
      </g>
    </g>

    <!-- Bottom Metadata Specs -->
    <text x="0" y="325" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
      Unity • Unreal Engine 5 • Godot 4 • C++ • Rust • JavaScript • Python • Roguelikes &amp; RTS
    </text>
  </g>

  <!-- Accent Bottom Border Line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#glowLine)" />
</svg>